---
- name: Деплой DevOps Resume
  hosts: all
  become: yes
  
  vars:
    app_dir: /opt/devops-resume
    app_port: 5001
    container_name: devops-resume
    image_name: devops-resume
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    repo_url: "{{ lookup('env', 'REPO_URL') | default('https://github.com/wa1nntt2/devops-resume.git', true) }}"
    
  tasks:
    - name: Проверка наличия Docker
      command: docker --version
      register: docker_check
      ignore_errors: yes

    - name: Ошибка если Docker не установлен
      fail:
        msg: "Docker не установлен. Запустите setup-server.yml сначала"
      when: docker_check.failed

    - name: Клонирование репозитория
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      when: ansible_connection != "local"

    - name: Копирование файлов (для локального теста)
      synchronize:
        src: ../../../
        dest: "{{ app_dir }}"
        rsync_opts:
          - "--exclude=venv"
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.pytest_cache"
          - "--exclude=ansible"
      when: ansible_connection == "local"

    - name: Сборка Docker образа
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ app_dir }}"
          pull: yes
        state: present

    - name: Остановка старого контейнера
      docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: yes

    - name: Запуск контейнера
      docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:5000"
        env:
          FLASK_ENV: "production"

    - name: Ожидание запуска приложения
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 10
      delay: 3
      until: health_check.status == 200

    - name: Результат деплоя
      debug:
        msg: |
          Приложение задеплоено!
          Container: {{ container_name }}
          Image: {{ image_name }}:{{ image_tag }}
          URL: http://localhost:{{ app_port }}
          Health: {{ health_check.json }}
