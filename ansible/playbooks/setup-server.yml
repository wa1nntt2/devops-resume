---
- name: Настройка сервера для DevOps Resume
  hosts: all
  become: yes
  
  tasks:
    - name: Обновление системы
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Установка необходимых пакетов
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
          - curl
          - htop
          - nginx
          - python3-pip
        state: present

    - name: Установка Docker SDK для Python
      pip:
        name:
          - docker
          - docker-compose
        state: present

    - name: Запуск Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Добавление пользователя в группу docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Создание директории для приложения
      file:
        path: /opt/devops-resume
        state: directory
        mode: '0755'

    - name: Информация о системе
      debug:
        msg: |
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          CPU: {{ ansible_processor_count }} cores
          RAM: {{ ansible_memtotal_mb }} MB
